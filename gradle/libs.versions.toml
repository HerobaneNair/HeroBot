[versions]
java = "21"

# Fabric (mod)
loom = "1.19.3"

# Paper (plugin)
paperweight = "2.0.0-beta.24"

# Shared libraries
pathetic = "5.5.2"
voicechat = "2.6.20"

jetbrains-annotations = "26.0.2-1"
slf4j = "2.0.16"
gson = "2.13.2"

# Build plugins resolved through build-logic
shadow = "9.6.1"
run-paper = "3.1.0"
plugin-yml = "0.9.0"

[libraries]
pathetic-api = { group = "de.bsommerfeld.pathetic", name = "api", version.ref = "pathetic" }
pathetic-engine = { group = "de.bsommerfeld.pathetic", name = "engine", version.ref = "pathetic" }

voicechat-api = { group = "de.maxhenkel.voicechat", name = "voicechat-api", version.ref = "voicechat" }

jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Plugin markers, consumed by build-logic so convention plugins can apply them by id
plugin-shadow = { group = "com.gradleup.shadow", name = "com.gradleup.shadow.gradle.plugin", version.ref = "shadow" }
plugin-run-paper = { group = "xyz.jpenilla.run-paper", name = "xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-paper" }
plugin-yml-paper = { group = "de.eldoria.plugin-yml.paper", name = "de.eldoria.plugin-yml.paper.gradle.plugin", version.ref = "plugin-yml" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
